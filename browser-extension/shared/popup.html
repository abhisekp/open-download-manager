<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Download Manager</title><link rel="stylesheet" href="popup.css"></head><body><h1><img src="icons/icon-48.png" width="30" height="30" alt=""> Open Download Manager</h1><p>Send a link to your paired local app.</p><form id="send"><label>Download link<input id="url" required type="text" placeholder="https://example.com/file.zip"></label><button>Download with ODM</button></form><p id="status" role="status"></p><details><summary>Connect to ODM</summary><p>Copy this browser identity into ODM Settings, then paste the returned pairing JSON below.</p><input id="identity" readonly aria-label="Browser identity"><form id="pair"><label>Pairing JSON<textarea id="pairing" rows="5" required></textarea></label><button>Save pairing</button></form><button id="disconnect">Forget pairing</button><p>Pairs with this running ODM session only. No cookies or browsing history are collected.</p></details><script src="connection.js"></script><script src="popup.js"></script></body></html>
