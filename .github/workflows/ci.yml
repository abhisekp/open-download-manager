name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Toolchain inventory
        run: |
          go version
          node --version
          python3 --version
          python3 scripts/version.py --check
      - name: Build interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run test:sites
      - name: Test and inspect
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          python3 -m unittest discover -s scripts -p "test_*.py"
          go mod verify
          go vet ./...
          go test -race ./...
          (cd internal/nettoolscompat && go test -race ./...)
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          npm audit --prefix ui --omit=dev --audit-level=high
      - name: Cross compile portable targets
        run: |
          python3 scripts/build.py
          python3 scripts/linux_packages.py
          node --test browser-extension/test.cjs
          python3 scripts/extensions.py
          npx --yes web-ext@10.8.0 lint --source-dir dist/extension-firefox --warnings-as-errors
          python3 scripts/checksums.py
          python3 scripts/verify_artifacts.py --kind portable
      - name: Real engine integration
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 xdg-utils qemu-user dbus-x11 gnome-keyring
          python3 scripts/os_keyring_check.py
          go build -o /tmp/odm .
          python3 scripts/smoke.py --exe /tmp/odm
          python3 scripts/smoke.py --exe /tmp/odm --native-http
          python3 scripts/recovery_test.py --exe /tmp/odm --root /tmp/odm-recovery
          python3 scripts/native_mode_test.py --exe /tmp/odm
          python3 scripts/addons_test.py --exe /tmp/odm --native-http
          python3 scripts/lock_recovery_test.py --exe /tmp/odm
          python3 scripts/queue_integration.py --exe /tmp/odm
          python3 scripts/segmented_integration.py --exe /tmp/odm
          python3 scripts/degraded_engine_test.py --exe /tmp/odm
      - name: Install, launch and uninstall Debian package
        run: bash scripts/linux_install_test.sh
      - name: Exercise Linux x86 and emulated ARMv7 binaries
        run: |
          version="$(python3 scripts/version.py)"
          python3 scripts/native_mode_test.py --exe "dist/odm-$version-linux-386/odm"
          printf '#!/usr/bin/env bash\nexec qemu-arm "%s/dist/odm-%s-linux-arm/odm" "$@"\n' "$GITHUB_WORKSPACE" "$version" > /tmp/odm-arm-test
          chmod +x /tmp/odm-arm-test
          python3 scripts/native_mode_test.py --exe /tmp/odm-arm-test
          python3 scripts/lock_recovery_test.py --exe /tmp/odm-arm-test
          python3 scripts/degraded_engine_test.py --exe /tmp/odm-arm-test
      - name: Validate Debian metadata
        run: |
          for package in dist/*.deb; do dpkg-deb --info "$package"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: odm-portable-development
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/build-targets.json
          if-no-files-found: error
          retention-days: 14

  arm-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build UI and run native platform and add-on tests
        run: |
          npm ci --prefix ui --ignore-scripts
          npm run build --prefix ui
          go test ./...
          go build -o odm-runtime.exe .
          python scripts/native_mode_test.py --exe odm-runtime.exe
          python scripts/lock_recovery_test.py --exe odm-runtime.exe
          python scripts/queue_integration.py --exe odm-runtime.exe
          python scripts/segmented_integration.py --exe odm-runtime.exe
          python scripts/degraded_engine_test.py --exe odm-runtime.exe
      - name: Install private Linux credential test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Verify disposable OS keyring entry on native platform
        run: python scripts/os_keyring_check.py
