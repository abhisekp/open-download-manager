name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain inventory
        run: |
          go version
          node --version
          python3 --version
      - name: Build interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run test:sites
      - name: Test and inspect
        run: |
          test -z "$(gofmt -l *.go)"
          go mod verify
          go vet ./...
          go test -race ./...
          (cd internal/nettoolscompat && go test -race ./...)
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          npm audit --prefix ui --omit=dev --audit-level=high
      - name: Cross compile portable targets
        run: |
          python3 scripts/build.py
          python3 scripts/linux_packages.py
          node --test browser-extension/test.cjs
          python3 scripts/extensions.py
          python3 scripts/checksums.py
      - name: Real engine integration
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          go build -o /tmp/odm .
          python3 scripts/smoke.py --exe /tmp/odm
          python3 scripts/recovery_test.py --exe /tmp/odm --root /tmp/odm-recovery
          python3 scripts/native_mode_test.py --exe /tmp/odm
      - name: Validate Debian metadata
        run: |
          for package in dist/*.deb; do dpkg-deb --info "$package"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odm-portable-development
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/build-targets.json
          retention-days: 14
