name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build and inspect artifacts without creating a release
        default: true
        type: boolean
      publish_after_review:
        description: Publish the prerelease after a separate environment approval
        default: false
        type: boolean
      source_ref:
        description: Signed commit or branch to validate (ignored for draft creation)
        default: main
        type: string
      tag:
        description: Existing reviewed v0.1.0-dev tag (required for draft creation)
        default: v0.1.0-dev
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.validation_only && inputs.source_ref || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify signed source and release tag
        id: source
        env:
          VALIDATION_ONLY: ${{ inputs.validation_only }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gpg --import .github/release-signers.asc
          git verify-commit --raw HEAD 2> signature.txt
          grep -q "VALIDSIG 0C11F14DCCBC95B710E92B988F9C80E5E7CE296A" signature.txt
          if [ "$VALIDATION_ONLY" != true ]; then
            test "$TAG" = v0.1.0-dev
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate and build candidates
        run: |
          npm ci --prefix ui --ignore-scripts
          npm run build --prefix ui
          npm run test:sites --prefix ui
          test -z "$(gofmt -l *.go)"
          python3 -m unittest discover -s scripts -p "test_*.py"
          go mod verify
          go vet ./...
          go test -race ./...
          (cd internal/nettoolscompat && go test -race ./...)
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          npm audit --prefix ui --omit=dev --audit-level=high
          python3 scripts/build.py
          python3 scripts/linux_packages.py
          node --test browser-extension/test.cjs
          python3 scripts/extensions.py
          python3 scripts/checksums.py
          python3 scripts/verify_artifacts.py --kind portable
          for package in dist/*.deb; do dpkg-deb --info "$package"; done
      - name: Generate and validate dependency inventory
        run: |
          python3 scripts/sbom.py
          python3 -m venv "$RUNNER_TEMP/odm-tools"
          "$RUNNER_TEMP/odm-tools/bin/pip" install jsonschema==4.25.1
          "$RUNNER_TEMP/odm-tools/bin/python" scripts/validate_sbom.py dist/odm.cdx.json
      - name: Attest package build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest dependency inventory for packages
        id: inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/odm.cdx.json
      - name: Retain attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.inventory.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/provenance.sigstore.json
          cp "$SBOM_BUNDLE" dist/sbom.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/build-targets.json
            dist/odm.cdx.json
            dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 14
  draft:
    if: ${{ !inputs.validation_only }}
    needs: validate
    environment: release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: dist
      - name: Verify candidate and require successful CI for exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = v0.1.0-dev
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$SOURCE_SHA" -f status=success --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id' > ci-runs.txt
          test -s ci-runs.txt
          python3 scripts/verify_artifacts.py --kind portable
          for package in dist/*.zip dist/*.tar.gz dist/*.deb; do
            python3 scripts/verify_provenance.py "$package" --repo "$GITHUB_REPOSITORY" --source "$SOURCE_SHA"
          done
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/*.deb dist/SHA256SUMS dist/build-targets.json dist/odm.cdx.json dist/*.sigstore.json --verify-tag --draft --prerelease --title "Open Download Manager $TAG" --notes-file docs/RELEASE-NOTES.md

  publish:
    if: ${{ !inputs.validation_only && inputs.publish_after_review }}
    needs: [validate, draft]
    environment: release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Verify uploaded draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = v0.1.0-dev
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$TAG" --dir dist
          python3 scripts/verify_artifacts.py --kind portable
          for package in dist/*.zip dist/*.tar.gz dist/*.deb; do
            python3 scripts/verify_provenance.py "$package" --repo "$GITHUB_REPOSITORY" --source "$SOURCE_SHA"
          done
      - name: Publish reviewed prerelease and read back
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --prerelease
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          gh release view "$TAG" --json url,isPrerelease,tagName
