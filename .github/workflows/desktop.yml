name: Native desktop candidates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build UI and native backend
        run: |
          python scripts/version.py --check
          npm ci --prefix ui --ignore-scripts
          npm run build --prefix ui
          python scripts/prepare_desktop.py
      - name: Install reviewed desktop dependencies
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npm audit --audit-level=high
          npm test
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Exercise real native window and backend (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a npm run smoke
      - name: Exercise real native window and backend (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run smoke
      - name: Package native application
        working-directory: desktop
        run: |
          node package.cjs
          node verify-package.cjs
      - name: Exercise packaged code and backend (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          resources="$(dirname "$(find out -name app.asar -print -quit)")"
          sudo chown root:root out/*/chrome-sandbox
          sudo chmod 4755 out/*/chrome-sandbox
          xvfb-run -a npm exec -- electron smoke.cjs "$resources"
          xvfb-run -a node packaged-smoke.cjs
      - name: Exercise packaged code and backend (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: |
          resources="$(dirname "$(find out -name app.asar -print -quit)")"
          npm exec -- electron smoke.cjs "$resources"
          node packaged-smoke.cjs
      - name: Archive candidate with permissions preserved
        run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: odm-desktop-${{ matrix.os }}-development
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 14
